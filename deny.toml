# cargo-deny policy. CI runs `cargo deny check` on every PR and daily.

[graph]
all-features = true

[advisories]
# Vulnerabilities and unsound crates fail the check; nothing is ignored
# without a comment explaining why.
yanked = "deny"
ignore = []

[licenses]
confidence-threshold = 0.9
unused-allowed-license = "allow"
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]

[licenses.private]
# Workspace crates are unpublished and carry no license yet.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[sources.allow-org]
# Sibling org repos whose crates we may reuse (e.g. ant-crypto).
github = ["freedom-hq", "solardev-xyz"]
