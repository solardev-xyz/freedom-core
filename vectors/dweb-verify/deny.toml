# cargo-deny policy for the dweb-verify vector generator: the core's
# (../../deny.toml), with the exceptions the pinned nodes' graphs need, each
# explained. The `dweb-verify vectors` workflow runs `cargo deny --locked
# check` here whenever the generator changes.
#
# What every exception below rests on: this workspace is a test-vector
# generator. It ships in nothing, and runs only where its vectors are
# regenerated. Its Swarm half drives Ant's gateway router in process over a
# memory chunk source (src/gateway.rs, src/store.rs), and its IPFS half runs
# freedom-ipfs's GatewayCore over a memory provider and a resolver of its own
# (src/ipfs.rs). Its only sockets are to the Kubo it starts itself, offline,
# on 127.0.0.1, by address (src/kubo.rs): it resolves no name and reaches
# nothing else. The patched releases these pins allow are taken (tokio
# 1.54.1, h2 0.4.20, crossbeam-epoch 0.9.21, spin 0.9.9, quinn-proto 0.11.19,
# rustls 0.23.46, rustls-webpki 0.103.16, url 2.5.9, libp2p-quic 0.13.1,
# quinn-udp 0.5.16); what remains needs a manifest change in Ant v0.5.71 or
# freedom-ipfs, the oracles, which would change what the vectors record.

[graph]
all-features = true

[advisories]
yanked = "deny"
ignore = [
    # hickory-proto 0.25.2, through hickory-resolver 0.25.2, which both
    # libp2p-dns (libp2p, ant-retrieval) and freedom-ipfs-net take: the
    # NSEC3 loop is in DNSSEC validation, which needs hickory's dnssec
    # features, and this graph builds it without them. The fix is hickory
    # 0.26, which neither libp2p-dns 0.44 nor freedom-ipfs-net takes. The
    # generator resolves no name.
    { id = "RUSTSEC-2026-0118", reason = "DNSSEC validation only, built without its features; the generator resolves no name" },
    # The same crate and paths: quadratic name compression when encoding a
    # message. The generator encodes and sends no DNS message.
    { id = "RUSTSEC-2026-0119", reason = "message encoding only; the generator sends no DNS message" },
    # The same crate and paths: ten more flaws in DNSSEC validation (NSEC and
    # NSEC3 proofs, unrelated or other-class RRsets taken as secure), and
    # hickory-resolver's lookups returning records that failed it. All of it
    # lives in hickory-proto's `dnssec` module (DnssecDnsHandle), compiled
    # only with its dnssec-ring or dnssec-aws-lc-rs feature, and in
    # hickory-resolver's `__dnssec` branch: this graph enables neither
    # (hickory-proto: std, tokio, futures-io; hickory-resolver:
    # system-config, tokio), so a resolver can't even ask to validate. No
    # hickory-proto release fixes these; the fixes are in hickory-net and
    # hickory-resolver 0.26.2, outside libp2p-dns 0.44 and freedom-ipfs-net.
    { id = "RUSTSEC-2026-0504", reason = "DNSSEC validation only, not compiled: no dnssec feature in this graph" },
    { id = "RUSTSEC-2026-0505", reason = "DNSSEC validation only, not compiled: no dnssec feature in this graph" },
    { id = "RUSTSEC-2026-0511", reason = "DNSSEC validation only, not compiled: no dnssec feature in this graph" },
    { id = "RUSTSEC-2026-0512", reason = "DNSSEC validation only, not compiled: no dnssec feature in this graph" },
    { id = "RUSTSEC-2026-0514", reason = "hickory-resolver's DNSSEC validation, not compiled: no dnssec feature in this graph" },
    { id = "RUSTSEC-2026-0530", reason = "DNSSEC validation only, not compiled: no dnssec feature in this graph" },
    { id = "RUSTSEC-2026-0531", reason = "DNSSEC validation only, not compiled: no dnssec feature in this graph" },
    { id = "RUSTSEC-2026-0532", reason = "DNSSEC validation only, not compiled: no dnssec feature in this graph" },
    { id = "RUSTSEC-2026-0549", reason = "DNSSEC validation only, not compiled: no dnssec feature in this graph" },
    { id = "RUSTSEC-2026-0550", reason = "DNSSEC validation only, not compiled: no dnssec feature in this graph" },
    { id = "RUSTSEC-2026-0551", reason = "DNSSEC validation only, not compiled: no dnssec feature in this graph" },
    # The same crate and paths: panics parsing SVCB or HTTPS records, and
    # zone-file tokens, from their text form. That parser
    # (`serialize::txt`) is compiled only with hickory-proto's text-parsing
    # feature, which this graph doesn't enable; DNS answers are decoded
    # from the wire format, which doesn't reach it. Fixed in 0.26.2.
    { id = "RUSTSEC-2026-0487", reason = "zone-file text parser only, not compiled: no text-parsing feature in this graph" },
    { id = "RUSTSEC-2026-0489", reason = "zone-file text parser only, not compiled: no text-parsing feature in this graph" },
    { id = "RUSTSEC-2026-0490", reason = "zone-file text parser only, not compiled: no text-parsing feature in this graph" },
    # The same crate and paths: decoding a DNS message reserves memory by the
    # record counts its header claims. Only DNS answers reach that decoder,
    # through a resolver: freedom-ipfs-net's system lookup and /dnsaddr
    # expansion, or libp2p-dns. The generator builds none of them: GatewayCore
    # gets its own resolver (src/ipfs.rs), Ant's router its own node loop
    # (src/node.rs), and neither half builds a libp2p transport or a
    # freedom-ipfs Network. Fixed in 0.26.2.
    { id = "RUSTSEC-2026-0491", reason = "decodes DNS answers only; the generator builds no resolver and receives no DNS message" },
    # instant 0.1.13, through parking_lot 0.11 (reed-solomon-erasure 6,
    # ant-retrieval): unmaintained, no upgrade within Ant's pins. It reads the
    # clock; nothing of it is security-relevant here.
    { id = "RUSTSEC-2024-0384", reason = "unmaintained, no upgrade within the pinned Ant; a clock shim in a generator that ships nowhere" },
    # paste 1.0.15, a proc macro through netlink-packet-core (if-watch,
    # libp2p-tcp): unmaintained, compile time only, as freedom-ipfsd's policy
    # notes for the same crate.
    { id = "RUSTSEC-2024-0436", reason = "unmaintained proc macro, compile time only; no upgrade exists" },
    # crypto-bigint 0.5.5, through k256 0.13 (ant-crypto, pinned Ant
    # v0.5.71): branches that aren't constant-time on secret integers, fixed
    # only in 0.7.6, which Ant's k256 0.13 can't take. The generator signs
    # only fixture records, with seeded keys that are published in the
    # vectors, offline; it has no secret to leak.
    { id = "RUSTSEC-2026-0387", reason = "signs only fixtures with public seeded test keys, offline; no secret to leak" },
    # rsa 0.9.10, the generator's own: it signs the vectors' RSA-keyed IPNS
    # records. The Marvin timing side channel is in private-key operations,
    # and these are made, but with test keys derived from public labels
    # (src/ipns.rs), offline, where no one times them: there is no secret.
    { id = "RUSTSEC-2023-0071", reason = "signs test records with public test keys, offline; there is no secret to leak" },
    # libsqlite3-sys 0.37.0, through rusqlite 0.39 (ant-retrieval's disk
    # cache, freedom-ipfs-store): the bundled SQLite can return stale page
    # cache memory when it opens a database beside a crafted -wal file. The
    # fix, libsqlite3-sys 0.39, comes with rusqlite 0.41, which neither Ant's
    # nor freedom-ipfs's rusqlite 0.39 takes. The generator opens no SQLite
    # database: its chunks and blocks are in memory (src/store.rs,
    # src/ipfs.rs), and it builds neither a DiskChunkCache nor a
    # SqliteBlockStore.
    { id = "RUSTSEC-2026-0459", reason = "the generator opens no SQLite database; its stores are in memory" },
]

[licenses]
confidence-threshold = 0.9
unused-allowed-license = "allow"
# webpki-roots (Mozilla's root certificates, through reqwest and
# libp2p-websocket): data under the Community Data License Agreement,
# permissive, as freedom-ipfsd's policy allows it. Scoped to that crate.
exceptions = [{ allow = ["CDLA-Permissive-2.0"], crate = "webpki-roots" }]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]

[licenses.private]
# The generator is unpublished and carries no license yet.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Ant, pinned by its v0.5.71 tag, and freedom-ipfs, by the commit
# freedom-ipfsd pins.
allow-git = [
    "https://github.com/freedom-hq/ant",
    "https://github.com/solardev-xyz/freedom-ipfs",
]
