[package]
name = "fc-eip1193"
description = "The Ethereum dispatcher in the core (design 0012, APR-5): a page's EIP-1193 requests, with the behavior of freedom-browser's page-ethereum.js"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# A request read as JSON.parse reads it and answers written as
# JSON.stringify writes them: JS's key order, numbers and lone surrogates,
# as main's dispatcher passed a page's params to the chain read (design
# 0012, APR-5b). fc-approval and fc-chain already link it.
fc-json = { path = "../fc-json" }
# `ipnsMhToCidV1Base36`, which the reference's name check compares with
# (APR-5f): fc-dweb's port of it. A workspace logic crate; no new external
# dependency.
fc-dweb = { path = "../fc-dweb" }
# A send's prompt shows `to` checksummed, as main's `getAddress` does
# (APR-5e-1): a workspace logic crate, no new external dependency.
fc-evm = { path = "../fc-evm" }

[dev-dependencies]
# The replays read vectors/eip1193.json; preserve_order keeps the
# reference's key order in what they compare.
serde_json = { version = "1", features = ["preserve_order"] }
