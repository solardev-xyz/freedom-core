[package]
name = "fc-approval"
description = "Approvals in the core (design 0012): approval tokens and what each binds, with the behavior of freedom-browser's signing-confirmation.js"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# The parse `sign.*` uses (design 0002): transactions, addresses, quantities,
# bytes, and the typed-data digest with its view (#88).
fc-evm = { path = "../fc-evm" }
# The grant files as JSON.parse reads them and JSON.stringify writes them:
# doubles (`1e400` is Infinity, written `null`), ECMAScript's number text,
# lone surrogates, JS's key order (design 0012, "The files"). fc-evm
# already links it.
fc-json = { path = "../fc-json" }
# Token bytes come from the caller's RNG (AGENTS rule 2).
rand_core = "0.10"
# preserve_order: the typed-data view lists `types`' names in the order the
# request gives them (fc-evm's eip712.rs reads the map's order), so this
# crate enables it itself, as freedom-cored does, rather than rely on another
# crate's features in its own tests and mobile builds (design 0012, "Crates
# and clocks").
#
# raw_value: `phone-payments.json`'s reader bounds each record as it stands
# in the file (design 0012, "Unverified payments").
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
# The record codec's strict read: every member once, none unknown. Already
# in the tree through serde_json, and freedom-cored derives with it.
serde = { version = "1", features = ["derive"] }
sha2 = { version = "0.11", default-features = false }
thiserror = "2"
# An x402 cap's key is the paid URL's origin (design 0012, Q11), as the
# WHATWG URL parser serializes it; fc-naming, fc-dweb and fc-chain link it.
url = "2"
# A token is a bearer secret: wiped when it is spent, dropped or evicted.
zeroize = "1.8"

[dev-dependencies]
# The x402 vectors' payloads are signed with a public test key, as the
# reference's signer signs them.
k256 = { version = "0.14", default-features = false, features = ["arithmetic", "ecdsa"] }
