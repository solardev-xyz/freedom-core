[package]
name = "freedom-cored"
description = "The desktop core process: owns the vault and keys, speaks fc-protocol over stdio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "freedom-cored"
path = "src/main.rs"

[dependencies]
fc-protocol = { path = "../fc-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = { version = "0.11", default-features = false, features = ["zeroize"] }
zeroize = "1.8"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", default-features = false, features = ["fs", "process", "std"] }

[dev-dependencies]
tempfile = "3"
