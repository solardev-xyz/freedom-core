[package]
name = "freedom-cored"
description = "The desktop core process: owns the vault and keys, speaks fc-protocol over stdio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

# The workspace lints, except that `unsafe_code` is `deny` instead of
# `forbid`: one Windows FFI call (GetDriveTypeW, storage.rs) carries a
# reviewed `#[allow(unsafe_code)]`. Logic crates keep `forbid`.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"

[[bin]]
name = "freedom-cored"
path = "src/main.rs"

[dependencies]
# Response bodies from main's shell.* executors travel as base64.
base64 = "0.22.1"
fc-evm = { path = "../fc-evm" }
fc-keys = { path = "../fc-keys" }
fc-naming = { path = "../fc-naming" }
fc-protocol = { path = "../fc-protocol" }
fc-swarm = { path = "../fc-swarm" }
fc-vault = { path = "../fc-vault" }
getrandom = "0.4"
rand_core = "0.10"
serde = { version = "1", features = ["derive"] }
# preserve_order: Radicle's config.json keeps its key order when merged.
serde_json = { version = "1", features = ["raw_value", "preserve_order"] }
sha2 = { version = "0.11", default-features = false, features = ["zeroize"] }
zeroize = "1.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", default-features = false, features = ["fs", "process", "std"] }

[dev-dependencies]
tempfile = "3"
