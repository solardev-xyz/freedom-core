[package]
name = "freedom-cored"
description = "The desktop core process: owns the vault and keys, speaks fc-protocol over stdio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

# The workspace lints, `forbid(unsafe_code)` included: the crate that holds
# the keys has no unsafe code. Its one OS call std lacks (GetDriveTypeW) is
# fc-sys's.
[lints]
workspace = true

[[bin]]
name = "freedom-cored"
path = "src/main.rs"

[features]
# Fault injection and the `test.*` methods for the integration tests, read
# from FREEDOM_CORED_TEST_* variables: see src/testhooks.rs. Without the
# feature every hook is a no-op, no variable is read, and no test method is
# compiled. build.rs refuses it in any release-profile or optimized build,
# and CI checks that it does. The tests that need it require it (below).
testhooks = []

# The integration tests that drive the hooks or the test methods: they build
# with `--all-features`, as CI's do, and are skipped without it.
[[test]]
name = "chain"
required-features = ["testhooks"]

[[test]]
name = "dweb"
required-features = ["testhooks"]

[[test]]
name = "device_remember"
required-features = ["testhooks"]

[[test]]
name = "fragments"
required-features = ["testhooks"]

[[test]]
name = "naming"
required-features = ["testhooks"]

[[test]]
name = "nodes"
required-features = ["testhooks"]

[[test]]
name = "profiles"
required-features = ["testhooks"]

[[test]]
name = "profile_delete"
required-features = ["testhooks"]

[[test]]
name = "profile_migrate"
required-features = ["testhooks"]

[[test]]
name = "profile_confined"
required-features = ["testhooks"]

[[test]]
name = "radicle_custody"
required-features = ["testhooks"]

[[test]]
name = "radicle_write"
required-features = ["testhooks"]

[[test]]
name = "seal"
required-features = ["testhooks"]

[[test]]
name = "serve"
required-features = ["testhooks"]

[[test]]
name = "vault"
required-features = ["testhooks"]

[dependencies]
# Response bodies from main's shell.* executors travel as base64.
base64 = "0.22.1"
# Design 0012's approvals: tokens, Safe approvals and the fee check (APR-3).
fc-approval = { path = "../fc-approval" }
# The chain-data machine the chain thread drives (design 0005).
fc-chain = { path = "../fc-chain" }
# dweb.open's planning (design 0006), on the naming thread.
fc-dweb = { path = "../fc-dweb" }
fc-evm = { path = "../fc-evm" }
# The JavaScript-semantics JSON reader fc-dweb's plans are written with:
# dweb.verify's plan reads back as dweb.open wrote it (design 0009).
fc-json = { path = "../fc-json" }
fc-keys = { path = "../fc-keys" }
fc-naming = { path = "../fc-naming" }
# The profile catalog's rules and text, which the profile subcommands run
# (design 0013).
fc-profile = { path = "../fc-profile" }
fc-protocol = { path = "../fc-protocol" }
# The sealed release of the Radicle node key (design 0008).
fc-seal = { path = "../fc-seal" }
# The Radicle home's gate, the Radicle service's own (design 0008, "Spawn
# and lock"), which every Radicle identity write and recovery takes.
fc-service = { path = "../fc-service" }
fc-swarm = { path = "../fc-swarm" }
fc-vault = { path = "../fc-vault" }
getrandom = "0.4"
rand_core = "0.10"
serde = { version = "1", features = ["derive"] }
# preserve_order: Radicle's config.json keeps its key order when merged.
serde_json = { version = "1", features = ["raw_value", "preserve_order"] }
sha2 = { version = "0.11", default-features = false, features = ["zeroize"] }
zeroize = "1.8"

[target.'cfg(windows)'.dependencies]
# GetDriveTypeW, for storage qualification; a directory's file ID, for a
# profile delete's walk (design 0013, "Deletion"); a permission file's
# owner (design 0012, "The files (Q10)").
fc-sys = { path = "../fc-sys" }

[target.'cfg(target_os = "macos")'.dependencies]
# futimes, for the profile lock's mtime in a confined subcommand (design
# 0013, "The lock").
fc-sys = { path = "../fc-sys" }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", default-features = false, features = ["fs", "process", "std"] }

[dev-dependencies]
# The profile-delete tests write secrets files in the core's own form
# (design 0013, PRF-1a).
fc-keystore = { path = "../fc-keystore" }
# The seal test checks the opened key against the Radicle public key.
ed25519-dalek = { version = "3.0", default-features = false }
tempfile = "3"
