[package]
name = "fc-vault"
description = "Freedom's identity vault: the passworder-compatible file format, lock state and unlock throttling"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
aes-gcm = { version = "0.11.1", default-features = false, features = ["aes", "alloc", "zeroize"] }
base64 = "0.22.1"
fc-keys = { path = "../fc-keys" }
rand_core = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.11", default-features = false, features = ["zeroize"] }
thiserror = "2"
zeroize = { version = "1.8", features = ["serde"] }

[dev-dependencies]
hex = "0.4"
