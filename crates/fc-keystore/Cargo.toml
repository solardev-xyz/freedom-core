[package]
name = "fc-keystore"
description = "The key store (design 0013, 5.4a): the KeyStore trait and its policies, and the profile's secrets file, AES-256-GCM entries under OS-kept wrapping keys, with its pending and forget records"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# Each entry is AES-256-GCM under its wrapping key (0013, "The secrets
# file"; AGENTS rule 7's list). fc-seal links the same version; the key
# schedule is wiped on drop. No `alloc` feature: entries are sealed in
# place.
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "zeroize"] }
# Nonces, ciphertexts and DPAPI's blob in the file: standard base64, padded.
# fc-keys and fc-protocol link the same version.
base64 = "0.22.1"
# The file's JSON: JavaScript's property order and `JSON.stringify(…, null,
# 2)`'s text, as the profile catalog and the forget file are written
# (fc-profile).
fc-json = { path = "../fc-json" }
# Item ids, nonces and wrapping keys come from the caller's RNG (AGENTS
# rule 2).
rand_core = "0.10"
thiserror = "2"
# Wrapping keys and opened secrets are wiped on drop (AGENTS rule 3).
zeroize = "1.8"

[dev-dependencies]
# The vectors' cross-check: every file the codec accepts names, for a
# profile delete, the items fc-profile's reader finds in it (PRF-3).
fc-profile = { path = "../fc-profile" }
hex = "0.4"
serde_json = { version = "1", features = ["preserve_order"] }
