[package]
name = "fc-swarm"
description = "Swarm single-owner chunks: BMT chunk addresses and SOC signing with bee-js parity"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
fc-evm = { path = "../fc-evm" }
k256 = { version = "0.14", default-features = false, features = ["arithmetic", "ecdsa"] }
thiserror = "2"

[dev-dependencies]
base64 = "0.22"
fc-keys = { path = "../fc-keys" }
hex = "0.4"
serde_json = "1"
sha2 = "0.11"
