[package]
name = "fc-ledger"
description = "A Ledger in the core (design 0016): paths, APDUs, the per-operation machines, sans-I/O, and the checks of every answer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# Transactions, the unsigned serialization a Ledger is sent, EIP-191 and
# the parsed typed data with its two hashes, keccak256, EIP-55 addresses
# and the recovery every signature is checked by. A logic crate of this
# workspace.
fc-evm = { path = "../fc-evm" }
# A path's elements as BIP-32 child indexes, and their encoding. A logic
# crate of this workspace.
fc-keys = { path = "../fc-keys" }
# The typed data's request form, which fc-evm parses.
serde_json = "1"
thiserror = "2"

[dev-dependencies]
# Generated device answers (design 0001, Testing): no input panics. Without
# its default features: no forking runner, no timeouts, no tempfile.
proptest = { version = "1.12", default-features = false, features = ["std"] }
