[package]
name = "fc-evm"
description = "Ethereum signing with ethers v6 parity: RLP, transactions, EIP-191 and EIP-712"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
k256 = { version = "0.14", default-features = false, features = ["arithmetic", "ecdsa"] }
# `float_roundtrip`: a JSON number is read as JSON.parse reads it, correctly
# rounded to the nearest double (#87). The default parser rounds
# approximately, so typed data could be signed for another integer than
# ethers signs.
serde_json = { version = "1", features = ["float_roundtrip"] }
sha3 = { version = "0.12", features = ["zeroize"] }
thiserror = "2"

[dev-dependencies]
fc-keys = { path = "../fc-keys" }
hex = "0.4"
