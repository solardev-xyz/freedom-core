[package]
name = "fc-evm"
description = "Ethereum signing with ethers v6 parity: RLP, transactions, EIP-191 and EIP-712"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# A number's spelling, reread with a correctly rounded parser (`parse_json`).
fc-json = { path = "../fc-json" }
k256 = { version = "0.14", default-features = false, features = ["arithmetic", "ecdsa"] }
serde_json = "1"
sha3 = { version = "0.12", features = ["zeroize"] }
thiserror = "2"

[dev-dependencies]
fc-keys = { path = "../fc-keys" }
hex = "0.4"
