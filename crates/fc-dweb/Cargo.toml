[package]
name = "fc-dweb"
description = "Dweb transports for Freedom (design 0006): plans for bzz:, ipfs: and ipns: requests, their response operations and the html() codec, with the behavior of freedom-browser's protocol handlers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# Test-only: at every release of a walk's memory, its live charged values
# are still covered, and a test may read the allocator there
# (`verifier::probe`); each input ends with the walk's holding equal to
# what its values are charged.
memory-probe = []

[dependencies]
fc-ipfs = { path = "../fc-ipfs" }
fc-json = { path = "../fc-json" }
fc-swarm = { path = "../fc-swarm" }
# freedom-ipfs's locked release, so the core types files as GatewayCore does.
mime_guess = "=2.0.5"
sha3 = "0.12"
thiserror = "2"
# The WHATWG URL parser the handlers' `new URL` follows; fc-naming links it already.
url = "2"

[dev-dependencies]
base64 = "0.22"
# A counting global allocator for the memory tests' high-water bound.
cap = "=0.1.2"
ed25519-dalek = { version = "3.0", default-features = false }
hex = "0.4"
serde_json = "1"
sha2 = "0.11"
# Inside the cap: an allocator that reports each allocation and release, so
# the memory tests count only the test's own thread, with a high-water mark
# that resets, for each request's real peak.
tracking-allocator = { version = "=0.4.0", default-features = false }
