[package]
name = "fc-naming"
description = "Name resolution for Freedom: ENSIP-15, namehash, the Universal Resolver, contenthash, CCIP-Read and Tezos Domains (design 0003)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
blake2 = { version = "0.11", default-features = false }
ens-normalize = "=0.1.1"
sha2 = { version = "0.11", default-features = false }
sha3 = "0.12"
thiserror = "2"
url = "2"

[dev-dependencies]
hex = "0.4"
serde = "1"
# The vectors nest Micheline deeper than serde_json's default 128 levels.
serde_json = { version = "1", features = ["unbounded_depth"] }
