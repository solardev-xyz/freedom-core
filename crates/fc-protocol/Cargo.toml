[package]
name = "fc-protocol"
description = "The freedom-cored wire protocol: frames, stream frames, message envelopes, secret fields and error codes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "0.22.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
thiserror = "2"
zeroize = "1.8"

[dev-dependencies]
hex = "0.4"
# Generated round trips (design 0001, Testing). Without its default
# features: no forking runner, no timeouts, no tempfile.
proptest = { version = "1.12", default-features = false, features = ["std"] }
