[package]
name = "fc-keys"
description = "Freedom key derivation: BIP-39, BIP-32, SLIP-10, the path registry and identity encoders"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

# RustCrypto's digest-0.11 generation: sha2 and digest have `zeroize`
# features there, so hash states are wiped. HMAC and PBKDF2 are implemented
# in src/kdf.rs (the hmac and pbkdf2 crates leave key pads and round
# buffers unwiped), and BIP-32 in src/secp256k1.rs, so every intermediate
# value is wiped too.
[dependencies]
aes = { version = "0.9", features = ["zeroize"] }
base64 = "0.22.1"
bs58 = { version = "0.5.1", default-features = false, features = ["alloc"] }
ctr = { version = "0.10", features = ["zeroize"] }
ed25519-dalek = { version = "3.0", default-features = false, features = ["zeroize"] }
k256 = { version = "0.14", default-features = false, features = ["arithmetic", "ecdsa"] }
rand_core = "0.10"
# Keystore KDF. Its internal PBKDF2 doesn't wipe the password's key pads;
# acceptable because the Bee keystore password is a random value that
# freedom-browser stores in plaintext in config.yaml anyway (K-3).
scrypt = { version = "0.12", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.11", default-features = false, features = ["zeroize"] }
sha3 = "0.12"
thiserror = "2"
unicode-normalization = "0.1.25"
zeroize = "1.8"

[dev-dependencies]
hex = "0.4"
# Reference implementations for kdf.rs's differential tests.
hmac = "0.13"
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
serde_json = "1"
