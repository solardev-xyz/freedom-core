[package]
name = "fc-keys"
description = "Freedom key derivation: BIP-39, BIP-32, SLIP-10, the path registry and identity encoders"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

# RustCrypto's digest-0.11 generation: hmac, sha2 and digest have `zeroize`
# features there, so HMAC key pads and hash states are wiped. BIP-32 is
# implemented in src/secp256k1.rs so every intermediate value it owns is
# wiped too.
[dependencies]
ed25519-dalek = { version = "3.0", default-features = false, features = ["zeroize"] }
hmac = { version = "0.13", features = ["zeroize"] }
k256 = { version = "0.14", default-features = false, features = ["arithmetic", "ecdsa"] }
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
rand_core = "0.10"
sha2 = { version = "0.11", default-features = false, features = ["zeroize"] }
sha3 = "0.12"
thiserror = "2"
unicode-normalization = "0.1.25"
zeroize = "1.8"

[dev-dependencies]
hex = "0.4"
serde_json = "1"
