[package]
name = "fc-keys"
description = "Freedom key derivation: BIP-39, BIP-32, SLIP-10, the path registry and identity encoders"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

# RustCrypto's digest-0.11 generation: sha2 and digest have `zeroize`
# features there, so hash states are wiped. HMAC and PBKDF2 are implemented
# in src/kdf.rs (the hmac and pbkdf2 crates leave key pads and round
# buffers unwiped), and BIP-32 in src/secp256k1.rs, so every intermediate
# value is wiped too.
[dependencies]
ed25519-dalek = { version = "3.0", default-features = false, features = ["zeroize"] }
k256 = { version = "0.14", default-features = false, features = ["arithmetic", "ecdsa"] }
rand_core = "0.10"
sha2 = { version = "0.11", default-features = false, features = ["zeroize"] }
sha3 = "0.12"
thiserror = "2"
unicode-normalization = "0.1.25"
zeroize = "1.8"

[dev-dependencies]
hex = "0.4"
# Reference implementations for kdf.rs's differential tests.
hmac = "0.13"
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
serde_json = "1"
