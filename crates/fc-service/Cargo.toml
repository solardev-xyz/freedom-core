[package]
name = "fc-service"
description = "The service processes' shared skeleton (design 0007): the lifetime lock, the handshake, parent death and the exit watchdog, the panic hook, hardening, and the frame I/O"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

# The workspace lints, `forbid(unsafe_code)` included. Its Windows calls
# std lacks (GetDriveTypeW, SetErrorMode, WerSetFlags) are fc-sys's.
[lints]
workspace = true

# Desktop only: the services never run on iOS or Android, where the crate is
# empty and pulls in nothing.
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
fc-protocol = { path = "../fc-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = { version = "0.11", default-features = false }

[target.'cfg(all(unix, not(any(target_os = "ios", target_os = "android"))))'.dependencies]
rustix = { version = "1.1", default-features = false, features = ["fs", "process", "std", "thread"] }

# Confinement (design 0010): Landlock and seccomp, pinned exactly (D6), and
# libc for the syscall numbers and constants the filters name; Landlock's
# version query is fc-sys's.
[target.'cfg(target_os = "linux")'.dependencies]
fc-sys = { path = "../fc-sys" }
landlock = "=0.4.7"
libc = "0.2"
seccompiler = { version = "=0.5.0", default-features = false }

# Seatbelt, libproc's thread count and executable path (design 0010,
# "macOS"): fc-sys's.
[target.'cfg(target_os = "macos")'.dependencies]
fc-sys = { path = "../fc-sys" }

[target.'cfg(windows)'.dependencies]
# GetDriveTypeW for storage qualification; SetErrorMode and WerSetFlags for
# hardening.
fc-sys = { path = "../fc-sys" }

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "linux")'.dev-dependencies]
# The confinement tests' calls through the other syscall ABIs.
fc-sys = { path = "../fc-sys", features = ["test-abis"] }
# The confinement tests' descriptors: inherited pipes and socket pairs,
# and an eventfd and an epoll descriptor to inject.
rustix = { version = "1.1", default-features = false, features = ["event", "net", "pipe", "std"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
# The confinement tests' Mach service lookups and port names, and an
# inherited pipe.
fc-sys = { path = "../fc-sys", features = ["test-macos"] }
rustix = { version = "1.1", default-features = false, features = ["pipe", "process", "std"] }

# The confinement tests run each case in a child of their own: a process
# confines itself once, and the default harness's threads would refuse it.
[[test]]
name = "confine"
harness = false
