[package]
name = "fc-chain"
description = "Chain data for Freedom (design 0005): the chain-data router's codecs, with the behavior of freedom-browser's chain-data-router.js"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
fc-json = { path = "../fc-json" }
# The sans-I/O executor the machine runs on (design 0005: "on fc-naming's
# executor").
fc-naming = { path = "../fc-naming" }
# The reference's regular expressions, matched in linear time: error texts
# can be as long as an answer. ASCII mode only, so no Unicode tables.
regex = { version = "1.12", default-features = false, features = ["std", "perf"] }
sha2 = { version = "0.11", default-features = false }
sha3 = "0.12"
thiserror = "2"

[dev-dependencies]
hex = "0.4"
serde_json = "1"
# The replay plays main, which maps endpoint references to hosts.
url = "2"
