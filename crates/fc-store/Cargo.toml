[package]
name = "fc-store"
description = "The core's files on disk (design 0013, \"How the core writes them\"): 0001's durable single-file write, the handle-relative directory, and a store file's bounded read, hooked write and set-aside"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true

# The workspace lints, `forbid(unsafe_code)` included. The Windows calls
# std lacks (a file's owner, its identity, and the handle-relative opens,
# renames, deletes and listings) are fc-sys's.
[lints]
workspace = true

[dependencies]
# The journal's records: V8's JSON.parse and JSON.stringify, as the
# reference reads and writes them. A workspace logic crate.
fc-json = { path = "../fc-json" }
# The journal's line checksum. Already in the tree (fc-approval, fc-profile,
# fc-service and others build it the same way).
sha2 = { version = "0.11", default-features = false }

[target.'cfg(unix)'.dependencies]
# openat, renameat, unlinkat, fstatat and O_NOFOLLOW for the handle-relative
# directory; a non-blocking open for the bounded read; getuid for its owner
# check. The features freedom-cored already builds rustix with.
rustix = { version = "1.1", default-features = false, features = ["fs", "process", "std"] }

[target.'cfg(windows)'.dependencies]
# A file's owner, read from its handle (freedom-core#360); a file's or a
# directory's file ID; and the anchor's handle-relative calls (design 0013,
# "Windows handle I/O (#963)").
fc-sys = { path = "../fc-sys" }

[dev-dependencies]
tempfile = "3"
