[workspace]
resolver = "3"
members = ["crates/*"]
# The service processes (design 0007) are workspaces of their own, with their
# own lockfiles and `cargo deny` policies: their dependency graphs never enter
# the core's. So is design 0009's vector generator, which links the pinned
# nodes only to record what they answer.
exclude = ["services", "vectors/dweb-verify"]

[workspace.package]
version = "0.8.0"
edition = "2024"
rust-version = "1.99"
publish = false
repository = "https://github.com/solardev-xyz/freedom-core"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Library code returns errors; it does not panic or print.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"

# Dependencies are optimized even in dev and test builds: unoptimized scrypt
# (N = 2^17) and PBKDF2 (900k rounds) take minutes per call. Workspace crates
# stay unoptimized for debugging.
[profile.dev.package."*"]
opt-level = 3

# The crypto crates themselves too: the vault KDF (900k PBKDF2 rounds) runs
# in fc-keys and would take seconds per call unoptimized.
[profile.dev.package.fc-keys]
opt-level = 3

[profile.dev.package.fc-vault]
opt-level = 3

# Typed-data hashing runs inline in the core; its bounded-time tests hold
# only for optimized code.
[profile.dev.package.fc-evm]
opt-level = 3
