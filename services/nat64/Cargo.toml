# fc-nat64: NAT64 prefix discovery for the service processes (design 0007,
# "Network-specific NAT64 prefixes"; 0008, "The address policy").
#
# Shared by the services, never by the core: it lives under services/, which
# the core's workspace excludes, so its dependencies (hickory-proto and the
# per-OS crates) stay out of the core's graph. It is a member of
# freedom-ipfsd's workspace, whose lockfile, lints, tests and `cargo deny`
# cover it; another service depends on it by path.
#
# The `fc-` prefix is the repository's for its own library crates; the
# directory says it is the services'.

[package]
name = "fc-nat64"
description = "NAT64 prefix discovery for the service processes: the resolvers each interface learned, the ipv4only.arpa query, and the state they publish (designs 0007 and 0008)"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
repository = "https://github.com/solardev-xyz/freedom-core"
workspace = "../freedom-ipfsd"

[dependencies]
# Logging, as the services log: JSON lines on stderr.
fc-service = { path = "../../crates/fc-service" }
# The state discovery publishes and the RFC 6052 arithmetic (`Nat64State`,
# `Nat64Prefix`): freedom-ipfs-addr, the gate's pure half with no network
# stack (freedom-ipfs #55), at the commit freedom-ipfsd pins, so both resolve
# to one package, which freedom-ipfs-net re-exports as its gate.
freedom-ipfs-addr = { git = "https://github.com/solardev-xyz/freedom-ipfs", rev = "2664d71f2019f8e690b0ec959180bec707a06f32" }
# Discovery's one query and its answers (src/query.rs): DNS messages, already
# in every platform's graph (freedom-ipfs-net's resolver, libp2p-dns). It
# encodes only its own one-question query, and decodes the answers, as
# freedom-ipfsd's deny.toml's hickory-proto ignores require.
hickory-proto = { version = "0.25", default-features = false, features = ["std"] }
serde_json = "1"

# The resolvers per OS (src/resolvers.rs), each crate already in that
# platform's graph, so none adds a crate to the binary: macOS reads the
# network services' DNS state from the SystemConfiguration dynamic store
# (system-configuration) and a link-local resolver's interface index
# (if-addrs), both if-watch's; Windows reads each adapter's DNS servers
# (ipconfig, hickory-resolver's) and the servers DHCP gave it from the
# registry (windows-registry, ipconfig's).
[target.'cfg(target_os = "macos")'.dependencies]
system-configuration = "0.7"
if-addrs = "0.15"

[target.'cfg(windows)'.dependencies]
ipconfig = "0.3"
windows-registry = "0.6"

# freedom-ipfsd's lints, copied: it defines no workspace lints to inherit.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
