# freedom-radicled: the libradicle service process (design 0008).
#
# Its own Cargo workspace, excluded from the core's, as freedom-ipfsd's is:
# its own lockfile, `cargo deny` policy and (with its release) notices, so
# libradicle's graph (heartwood, libgit2, SQLite) never enters the core's
# (0008, "Where the code lives"). It shares `fc-protocol`, `fc-service` and
# `fc-seal` with the core, by path.

[package]
name = "freedom-radicled"
description = "The libradicle service process: one Radicle node per process, over stdin and stdout frames (design 0008)"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
repository = "https://github.com/solardev-xyz/freedom-core"

[workspace]
resolver = "3"

[features]
# Fault injection for the integration tests, read from FREEDOM_RADICLED_TEST_*
# variables: see src/testhooks.rs. Without the feature every hook is a no-op
# and no variable is read. build.rs refuses it in any release-profile or
# optimized build, and CI checks that it does.
testhooks = []

[dependencies]
# The frame codec and error codes, shared with the core.
fc-protocol = { path = "../../crates/fc-protocol" }
# The service skeleton: the gate, hardening, the panic hook, watchdogs and the
# connection to main.
fc-service = { path = "../../crates/fc-service" }
# The sealed release of the node key (0008, "The sealed release"): the
# service's X25519 key for one start, and opening what the core sealed to it.
fc-seal = { path = "../../crates/fc-seal" }
# libradicle at `integration/rust-core` (cd8e119), built with `no-spawn`,
# explicitly (0008, "Spawn and lock"): serving runs in process and `git gc`
# is skipped. It carries the upstream changes 0008 lists for the service's
# first steps: the routing, `isolated` and `control_socket` options, the
# bounded reads and shutdown, the node's health, the host key
# (`HostKey`, `start_with_key`), and heartwood at 003fd9ca, whose
# reconciliation driver `rad.reconcile` runs on, with its seed gate and its
# host failures (`driver::Error::Host`). It also has the shipped seeds for a
# main-network profile only, an isolated node with no proxy, onion, I2P or
# external-address route, `isolate_git_config` (called first thing in
# src/main.rs), `Options::seeding_policy`, and the host's repository gate
# (`Options::repositories`), the online repair signed with the node's key
# and `remove_quarantined` (libradicle item 9a), and a stop that reports who
# asked, how the node's thread ended and the home apart (`Shutdown`). Pinned
# by commit until those changes are released (deny.toml allows solardev-xyz).
# src/build_info.rs reports the same commit.
libradicle = { git = "https://github.com/solardev-xyz/libradicle", rev = "cd8e11919d929f8012b78478005d3674de6cf902", features = ["no-spawn"] }
# heartwood's `radicle`, at the commit libradicle pins, so that both resolve
# to one package (build_info's test holds them to one commit): the node
# identity's public forms (`did:key`, the node ID), and, from the next step,
# the reconciliation driver. Already in libradicle's graph.
radicle = { git = "https://github.com/solardev-xyz/heartwood", rev = "003fd9ca59d1269e4b81fb696bec3bdb4068fe67" }
# The dial gate's address policy (0008, "The address policy": "one table and
# one classifier serve both services"): 0007's target classification, its
# table of refused blocks and the configured-target exemption, as
# freedom-ipfs-addr, the gate's pure half with no network stack (freedom-ipfs
# #55). At freedom-ipfsd's freedom-ipfs pin, which fc-nat64 also takes it at,
# so that it is one package.
freedom-ipfs-addr = { git = "https://github.com/solardev-xyz/freedom-ipfs", rev = "8a2311c2316b830b8bb3fe02e201765b2f5c35e0" }
# `socks5` mode's names, resolved through Arti's RESOLVE (0008, "Modes"): the
# SOCKS5 client's byte layer with its blocking driver, which heartwood's
# resolver thread runs (freedom-ipfs #56). Its only dependencies are
# freedom-ipfs-addr and thiserror.
freedom-ipfs-socks = { git = "https://github.com/solardev-xyz/freedom-ipfs", rev = "8a2311c2316b830b8bb3fe02e201765b2f5c35e0" }
# `direct` mode's NAT64 prefixes, learned as freedom-ipfsd learns them (0008,
# "The address policy"): shared by the services, by path.
fc-nat64 = { path = "../nat64" }
# The public key of a node key, as libradicle computes it (ed25519-dalek 2,
# libradicle's own version, already in its graph).
ed25519-dalek = { version = "2", default-features = false, features = ["zeroize"] }
# The OS's randomness: the X25519 key for one start, and a throwaway node key
# on a profile without a vault. Already in libradicle's graph.
getrandom = "0.4"
rand_core = "0.10"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
zeroize = "1"

# The dirty marker's opens (src/marker.rs): `O_NOFOLLOW` and `O_NONBLOCK`.
# Already in libradicle's graph.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
# tests/start.rs reads the node's stored announcements from its database, as
# heartwood writes them: SQLite at the version heartwood and libradicle use,
# already in the graph.
sqlite = "0.37"

# tests/process.rs: the kernel's Landlock ABI, which the report must name
# (design 0010, Tests: a silent downgrade fails).
[target.'cfg(target_os = "linux")'.dev-dependencies]
fc-sys = { path = "../../crates/fc-sys" }

# The core's workspace lints, copied: workspace lints don't cross workspaces.
# Except `unsafe_code`, which is `deny` here, as in fc-sys, not `forbid`
# (AGENTS.md rule 6): the one unsafe call, `libradicle::isolate_git_config`
# first thing in src/main.rs, carries its own reviewed `#[allow(unsafe_code)]`
# and a `SAFETY` comment, and every other unsafe block still fails to
# compile. tests/unsafe_code.rs fails if any other line lifts the lint.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"

# Dependencies carry no debug info in dev and test builds: libradicle's graph
# is large, and its debug info is most of a target directory.
[profile.dev.package."*"]
debug = false

# Request panics unwind to their request's catch (0008, "Crashes and
# restarts"): never `panic = "abort"`.
[profile.release]
panic = "unwind"
