# TEMPORARY macOS diagnostic for PR #342: which Seatbelt operation setting a
# directory's times needs. Removed once the cause is known.
name: tmp macOS times

on:
  pull_request:

permissions:
  contents: read

jobs:
  probe:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Probe each rule set
        run: |
          set -u
          sw_vers
          P="$PWD/scripts/tmp-times-probe.py"
          base="$(mktemp -d)"
          D="$(python3 -c 'import os,sys; print(os.path.realpath(sys.argv[1]))' "$base")"
          echo "base=$base real=$D"
          python3 "$P" plain "$D"
          run() {
            label="$1"; shift
            printf '(version 1)\n(allow default)\n%s\n' "$*" > "$RUNNER_TEMP/$label.sb"
            sandbox-exec -D "D=$D" -f "$RUNNER_TEMP/$label.sb" python3 "$P" "$label" "$D" || echo "[$label] exit $?"
          }
          G='(deny file-write* (subpath (param "D")))
          (allow file-write-create file-write-data file-write-unlink file-write-times (subpath (param "D")))'
          run control ''
          run grant "$G"
          for op in mode flags owner acl xattr setugid; do
            run "grant-$op" "$G
          (allow file-write-$op (subpath (param \"D\")))"
          done
          run grant-all "$G
          (allow file-write* (subpath (param \"D\")))"
          for op in times mode flags owner acl xattr setugid data; do
            run "deny-$op" "(deny file-write-$op (subpath (param \"D\")))"
          done
          # Also a path given through /var (not canonical).
          sandbox-exec -D "D=$D" -f "$RUNNER_TEMP/grant.sb" python3 "$P" grant-via-var "$base" || true
      - name: Sandbox log
        if: always()
        run: |
          log show --last 10m --style compact --predicate 'sender == "Sandbox"' | grep -i 'python' | grep 'T/tmp\.' | sed -e 's/^.*Sandbox: //' -e 's/([0-9]*)//' | sort | uniq -c | head -100 || true
          echo ---- any process, the temp path
          log show --last 10m --style compact --predicate 'eventMessage CONTAINS "T/tmp."' | sed -e 's/^.*Sandbox: //' | sort | uniq -c | head -100 || true
