name: Release freedom-ipfsd

# Builds freedom-ipfsd, the freedom-ipfs service (design 0007), for the same
# five platforms as freedom-cored (on Linux against glibc 2.17, where the
# core is static musl) and publishes the archives plus SHA256SUMS as a GitHub
# release, with build provenance attested for each. freedom-browser pins a
# release tag and the digest of its SHA256SUMS (see RELEASING.md).
#
# Only a tag push (ipfsd-vX.Y.Z, matching services/freedom-ipfsd's version)
# publishes. A manual run (on any ref, tags included) or a PR that changes
# this file builds and smoke-tests every target without publishing.
#
# Build jobs run repository code with a read-only token. Only the publish job
# can write, and it runs no repository code: it downloads the build
# artifacts, assembles SHA256SUMS, attests them and creates the release.

on:
  push:
    tags: ["ipfsd-v*"]
  pull_request:
    paths: [".github/workflows/release-ipfsd.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-ipfsd-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check tag
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.tag.outputs.publish }}
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - id: tag
        name: Publish only on a tag push matching the service's version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("services/freedom-ipfsd/Cargo.toml", "rb"))["package"]["version"])')
          [ -n "$version" ] || { echo "no [package] version" >&2; exit 1; }
          # The release tag is ipfsd-vX.Y.Z; the archives are
          # freedom-ipfsd-vX.Y.Z-<asset>.
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ "$GITHUB_REF_NAME" != "ipfsd-v$version" ]; then
              echo "tag $GITHUB_REF_NAME does not match freedom-ipfsd's version $version (ipfsd-v$version)" >&2
              exit 1
            fi
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "version=v$version" >> "$GITHUB_OUTPUT"
          else
            echo "dry run ($GITHUB_EVENT_NAME on $GITHUB_REF_TYPE $GITHUB_REF_NAME)"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "tag=ipfsd-v$version-dryrun" >> "$GITHUB_OUTPUT"
            echo "version=v$version-dryrun" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: build (${{ matrix.asset }})
    needs: check
    strategy:
      fail-fast: true
      matrix:
        include:
          - { runner: macos-latest, target: aarch64-apple-darwin, asset: darwin-arm64, native: true }
          - { runner: macos-latest, target: x86_64-apple-darwin, asset: darwin-amd64, native: false }
          # Linked dynamically against glibc 2.17, Rust's own floor for these
          # targets, so they run wherever Electron does (it needs 2.25), with
          # the OS's allocator: static musl's cost a quarter of the
          # throughput (0007, open question 6). cargo-zigbuild links them,
          # with Zig's copy of glibc 2.17's symbols and startup code.
          - { runner: ubuntu-latest, target: x86_64-unknown-linux-gnu, glibc: "2.17", asset: linux-amd64, native: true }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, glibc: "2.17", asset: linux-arm64, native: true }
          - { runner: windows-latest, target: x86_64-pc-windows-msvc, asset: windows-amd64, native: true }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
        working-directory: services/freedom-ipfsd
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
      - name: Zig and cargo-zigbuild
        if: matrix.glibc
        run: |
          # Their PyPI wheels, for the runner's architecture, pinned by
          # version and sha256. A wheel is a zip: the binaries need no pip.
          case "$(uname -m)" in
            x86_64)
              zig_url=https://files.pythonhosted.org/packages/db/81/f9f5c7fd68d80b8edff2a641a1c95ac4125356387d298374227040b8e1e8/ziglang-0.15.2-py3-none-manylinux_2_12_x86_64.manylinux2010_x86_64.musllinux_1_1_x86_64.whl
              zig_sha256=806316453d1ede7174ed3fefb8e5348154629089c3bb5fe812dfd0e172fac130
              zigbuild_url=https://files.pythonhosted.org/packages/95/2b/3fbef7958e7902b1c0119e1a028528df6a5d28bae11282ee550689cb8b59/cargo_zigbuild-0.23.4-py3-none-manylinux_2_5_x86_64.manylinux1_x86_64.whl
              zigbuild_sha256=0a149a2a07b9513d422efa9cc23e1add9741f08abe86845fa418eaeb4cca7931
              ;;
            aarch64)
              zig_url=https://files.pythonhosted.org/packages/53/7d/8c277208250ffa72f12a10f52dfc1d45850f08244093065b40c5f4628260/ziglang-0.15.2-py3-none-manylinux_2_17_aarch64.manylinux2014_aarch64.musllinux_1_1_aarch64.whl
              zig_sha256=edc0aa60ec964a4cf462d40f68d7de242ddf37fd9a80f2afaee6397059463230
              zigbuild_url=https://files.pythonhosted.org/packages/40/c8/ac728b3e0bfe97a1d9e94e61402c0e4524689e1d2d6665009f0682f32ca2/cargo_zigbuild-0.23.4-py3-none-manylinux_2_17_aarch64.manylinux2014_aarch64.whl
              zigbuild_sha256=9f848addf9ca16e8df52b4a86eb41f7555bb4205aea117ad521f501a307129f5
              ;;
            *)
              echo "no pinned Zig for $(uname -m)" >&2
              exit 1
              ;;
          esac
          tools="$RUNNER_TEMP/zigbuild"
          mkdir -p "$tools"
          cd "$tools"
          curl -fsSL -o zig.whl "$zig_url"
          curl -fsSL -o cargo-zigbuild.whl "$zigbuild_url"
          printf '%s  zig.whl\n%s  cargo-zigbuild.whl\n' "$zig_sha256" "$zigbuild_sha256" | sha256sum --check
          unzip -q zig.whl -d zig
          unzip -q cargo-zigbuild.whl -d cargo-zigbuild
          chmod +x zig/ziglang/zig cargo-zigbuild/cargo_zigbuild-0.23.4.data/scripts/cargo-zigbuild
          echo "$tools/zig/ziglang" >> "$GITHUB_PATH"
          echo "$tools/cargo-zigbuild/cargo_zigbuild-0.23.4.data/scripts" >> "$GITHUB_PATH"
          "$tools/zig/ziglang/zig" version
          "$tools/cargo-zigbuild/cargo_zigbuild-0.23.4.data/scripts/cargo-zigbuild" --version
      - name: Build
        env:
          # Windows: link the C runtime statically (no VC++ redistributable).
          RUSTFLAGS: ${{ contains(matrix.target, 'windows') && '-C target-feature=+crt-static' || '' }}
          GLIBC: ${{ matrix.glibc }}
        run: |
          if [ -n "$GLIBC" ]; then
            # The glibc version as a suffix of the target; the binary still
            # lands in target/<target>/release.
            cargo zigbuild --locked --release --target "${{ matrix.target }}.$GLIBC"
          else
            cargo build --locked --release --target ${{ matrix.target }}
          fi
      - name: Smoke test (usage exits 64)
        if: matrix.native
        run: |
          set +e
          bin=target/${{ matrix.target }}/release/freedom-ipfsd
          [ -f "$bin.exe" ] && bin="$bin.exe"
          "$bin" 2>/dev/null
          code=$?
          set -e
          echo "exit code $code"
          [ "$code" = 64 ]
      - name: glibc ${{ matrix.glibc }} on Linux
        if: matrix.glibc
        env:
          GLIBC: ${{ matrix.glibc }}
        run: |
          bin=target/${{ matrix.target }}/release/freedom-ipfsd
          file "$bin"
          # The highest glibc symbol version it needs is at most $GLIBC.
          highest="$(objdump -T "$bin" | grep -o 'GLIBC_[0-9][0-9.]*' | sed 's/^GLIBC_//' | sort -uV | tail -n 1 || true)"
          echo "highest GLIBC_ symbol version: $highest"
          if [ -z "$highest" ] || [ "$(printf '%s\n%s\n' "$highest" "$GLIBC" | sort -V | tail -n 1)" != "$GLIBC" ]; then
            echo "$bin needs glibc ${highest:-(none found)}, not $GLIBC at most" >&2
            exit 1
          fi
          # The libraries it needs are glibc's and libgcc_s, and nothing else.
          needed="$(readelf -d "$bin" | sed -n 's/.*(NEEDED).*\[\(.*\)\]$/\1/p')"
          echo "needed: $(echo $needed)"
          echo "$needed" | grep -qx 'libc.so.6' || { echo "$bin doesn't need libc.so.6" >&2; exit 1; }
          for lib in $needed; do
            case "$lib" in
              libc.so.6 | libm.so.6 | libpthread.so.0 | libdl.so.2 | librt.so.1 | libutil.so.1 \
                | ld-linux-x86-64.so.2 | ld-linux-aarch64.so.1 | libgcc_s.so.1) ;;
              *)
                echo "$bin needs $lib, which is neither glibc's nor libgcc_s" >&2
                exit 1
                ;;
            esac
          done
      - name: Package
        run: |
          name="freedom-ipfsd-${VERSION}-${{ matrix.asset }}"
          dist="$GITHUB_WORKSPACE/dist"
          mkdir -p "$dist"
          # The binary, plus the notices of the code it statically links:
          # its own THIRD-PARTY-NOTICES, and the Rust project's notice file
          # for the standard library, from the toolchain that built it.
          sysroot="$(rustc --print sysroot)"
          if command -v cygpath >/dev/null; then sysroot="$(cygpath -u "$sysroot")"; fi
          cp "$sysroot/share/doc/rust/COPYRIGHT-library.html" THIRD-PARTY-NOTICES-rust-std.html
          notices="THIRD-PARTY-NOTICES THIRD-PARTY-NOTICES-rust-std.html"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            archive="$name.zip"
            (cd target/${{ matrix.target }}/release && 7z a -tzip "$dist/$archive" freedom-ipfsd.exe >/dev/null)
            7z a -tzip "$dist/$archive" $notices >/dev/null
          else
            archive="$name.tar.gz"
            tar -czf "$dist/$archive" -C target/${{ matrix.target }}/release freedom-ipfsd -C "$PWD" $notices
          fi
          (cd "$dist" && (sha256sum "$archive" 2>/dev/null || shasum -a 256 "$archive") > "$archive.sha256")
          cat "$dist/$archive.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: freedom-ipfsd-${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: SHA256SUMS, provenance and publish
    needs: [check, build]
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Build provenance: a Sigstore certificate for this workflow run
      # (id-token), stored with the repository's attestations.
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.check.outputs.tag }}
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: freedom-ipfsd-*
          path: dist
          merge-multiple: true
      - name: Assemble SHA256SUMS
        working-directory: dist
        run: |
          count=$(ls *.sha256 | wc -l)
          [ "$count" = 5 ] || { echo "expected 5 checksums, got $count" >&2; exit 1; }
          cat *.sha256 | sort -k2 > SHA256SUMS
          rm *.sha256
          # Every listed archive must be present and match.
          sha256sum --check SHA256SUMS
          cat SHA256SUMS
          echo "digest of SHA256SUMS (pin this in freedom-browser):"
          sha256sum SHA256SUMS
      # SLSA build provenance for every archive and SHA256SUMS, signed for
      # this workflow at the tagged commit. Before the release exists, so a
      # failure here publishes nothing.
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
      - name: Draft, upload, publish
        working-directory: dist
        run: |
          # --verify-tag: never let gh create a tag that isn't there.
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "freedom-ipfsd $VERSION" \
            --notes "freedom-ipfsd, the freedom-ipfs service, for Freedom Browser (design 0007). Verify archives against SHA256SUMS, and their build provenance with: gh attestation verify <archive> --repo $GITHUB_REPOSITORY --signer-workflow $GITHUB_REPOSITORY/.github/workflows/release-ipfsd.yml --source-ref refs/tags/$TAG" \
            ./*.tar.gz ./*.zip SHA256SUMS
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
