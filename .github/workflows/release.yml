name: Release

# Builds freedom-cored for every platform Freedom Browser ships on and
# publishes the archives plus SHA256SUMS as a GitHub release. freedom-browser
# pins a release tag and the digest of its SHA256SUMS (see RELEASING.md).
#
# Only a tag push (vX.Y.Z, matching the workspace version) publishes. A manual
# run (on any ref, tags included) or a PR that changes this file builds and
# smoke-tests every target without publishing.
#
# Build jobs run repository code with a read-only token. Only the publish job
# can write, and it runs no repository code: it downloads the build
# artifacts, assembles SHA256SUMS and creates the release.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check tag
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.tag.outputs.publish }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - id: tag
        name: Publish only on a tag push matching the workspace version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          [ -n "$version" ] || { echo "no [workspace.package] version" >&2; exit 1; }
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ "$GITHUB_REF_NAME" != "v$version" ]; then
              echo "tag $GITHUB_REF_NAME does not match workspace version $version" >&2
              exit 1
            fi
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "dry run ($GITHUB_EVENT_NAME on $GITHUB_REF_TYPE $GITHUB_REF_NAME)"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "tag=v$version-dryrun" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: build (${{ matrix.asset }})
    needs: check
    strategy:
      fail-fast: true
      matrix:
        include:
          - { runner: macos-latest, target: aarch64-apple-darwin, asset: darwin-arm64, native: true }
          - { runner: macos-latest, target: x86_64-apple-darwin, asset: darwin-amd64, native: false }
          # Static musl binaries (crt-static is the musl default): no
          # dependency on the distribution's glibc.
          - { runner: ubuntu-latest, target: x86_64-unknown-linux-musl, asset: linux-amd64, native: true }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, asset: linux-arm64, native: true }
          - { runner: windows-latest, target: x86_64-pc-windows-msvc, asset: windows-amd64, native: true }
    runs-on: ${{ matrix.runner }}
    env:
      TAG: ${{ needs.check.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Toolchain
        shell: bash
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
      - name: Build
        shell: bash
        env:
          # Windows: link the C runtime statically (no VC++ redistributable).
          RUSTFLAGS: ${{ contains(matrix.target, 'windows') && '-C target-feature=+crt-static' || '' }}
        run: cargo build --locked --release -p freedom-cored --target ${{ matrix.target }}
      - name: Smoke test (usage exits 64)
        if: matrix.native
        shell: bash
        run: |
          set +e
          bin=target/${{ matrix.target }}/release/freedom-cored
          [ -f "$bin.exe" ] && bin="$bin.exe"
          "$bin" 2>/dev/null
          code=$?
          set -e
          echo "exit code $code"
          [ "$code" = 64 ]
      - name: Package
        shell: bash
        run: |
          name="freedom-cored-${TAG}-${{ matrix.asset }}"
          mkdir -p dist
          # The binary, plus the notices of the crates it statically links.
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            archive="$name.zip"
            (cd target/${{ matrix.target }}/release && 7z a -tzip "$GITHUB_WORKSPACE/dist/$archive" freedom-cored.exe >/dev/null)
            7z a -tzip "dist/$archive" THIRD-PARTY-NOTICES >/dev/null
          else
            archive="$name.tar.gz"
            tar -czf "dist/$archive" -C target/${{ matrix.target }}/release freedom-cored -C "$GITHUB_WORKSPACE" THIRD-PARTY-NOTICES
          fi
          (cd dist && (sha256sum "$archive" 2>/dev/null || shasum -a 256 "$archive") > "$archive.sha256")
          cat "dist/$archive.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: freedom-cored-${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: SHA256SUMS and publish
    needs: [check, build]
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.check.outputs.tag }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: freedom-cored-*
          path: dist
          merge-multiple: true
      - name: Assemble SHA256SUMS
        working-directory: dist
        run: |
          count=$(ls *.sha256 | wc -l)
          [ "$count" = 5 ] || { echo "expected 5 checksums, got $count" >&2; exit 1; }
          cat *.sha256 | sort -k2 > SHA256SUMS
          rm *.sha256
          # Every listed archive must be present and match.
          sha256sum --check SHA256SUMS
          cat SHA256SUMS
          echo "digest of SHA256SUMS (pin this in freedom-browser):"
          sha256sum SHA256SUMS
      - name: Draft, upload, publish
        working-directory: dist
        run: |
          # --verify-tag: never let gh create a tag that isn't there.
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "freedom-cored $TAG" \
            --notes "freedom-cored binaries for Freedom Browser. Verify archives against SHA256SUMS." \
            ./*.tar.gz ./*.zip SHA256SUMS
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
