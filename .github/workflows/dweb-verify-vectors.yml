name: dweb-verify vectors

# vectors/dweb-verify.json (design 0009) is recorded from the pinned Ant (and,
# later, Kubo and freedom-ipfs) by its own generator workspace,
# vectors/dweb-verify. Normal CI reads the committed JSON and never builds the
# generator: its graph (libp2p, SQLite, axum) is large and ships nowhere.
# This workflow builds it and regenerates the file, failing unless the result
# equals the committed one byte for byte, only when the generator or the file
# changes.

on:
  push:
    branches: [main]
    paths:
      - "vectors/dweb-verify/**"
      - "vectors/dweb-verify.json"
      - "rust-toolchain.toml"
      - ".github/workflows/dweb-verify-vectors.yml"
  pull_request:
    paths:
      - "vectors/dweb-verify/**"
      - "vectors/dweb-verify.json"
      - "rust-toolchain.toml"
      - ".github/workflows/dweb-verify-vectors.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dweb-verify-vectors-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_DENY_VERSION: "0.20.2"
  CARGO_DENY_SHA256: "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f"

jobs:
  check:
    name: dweb-verify vectors (regenerate and compare)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vectors/dweb-verify
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: vectors/dweb-verify -> target
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --release --all-targets -- -D warnings
      - name: Regenerate and compare
        run: cargo run --locked --release -- check

  deny:
    name: dweb-verify vectors cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - name: Install cargo-deny
        run: |
          tarball="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSL -o "$tarball" "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/${tarball}"
          echo "${CARGO_DENY_SHA256}  ${tarball}" | sha256sum --check
          tar -xzf "$tarball" --strip-components=1 -C "$HOME/.cargo/bin" "cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl/cargo-deny"
      - working-directory: vectors/dweb-verify
        run: cargo deny --locked check
