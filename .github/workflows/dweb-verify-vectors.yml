name: dweb-verify vectors

# vectors/dweb-verify.json (design 0009) is recorded from the pinned Ant, Kubo
# and freedom-ipfs by its own generator workspace,
# vectors/dweb-verify. Normal CI reads the committed JSON and never builds the
# generator: its graph (libp2p, SQLite, axum) is large and ships nowhere.
# This workflow builds it and regenerates the file, failing unless the result
# equals the committed one byte for byte, only when the generator or the file
# changes.

on:
  push:
    branches: [main]
    paths:
      - "vectors/dweb-verify/**"
      - "vectors/dweb-verify.json"
      - "vectors/dweb-verify-cases.json"
      - "rust-toolchain.toml"
      - ".github/workflows/dweb-verify-vectors.yml"
  pull_request:
    paths:
      - "vectors/dweb-verify/**"
      - "vectors/dweb-verify.json"
      - "vectors/dweb-verify-cases.json"
      - "rust-toolchain.toml"
      - ".github/workflows/dweb-verify-vectors.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dweb-verify-vectors-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_DENY_VERSION: "0.20.2"
  CARGO_DENY_SHA256: "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f"
  # The Kubo release the vectors pin (meta.kubo), checked against the
  # release's own SHA-512.
  KUBO_VERSION: "0.43.1"
  KUBO_SHA512: "ff53b2428794fc8cca39505d28c15b4cceaef4b90a09284f291f611fcdc8c06399690575fc89cbd4d85ef71f3652581296c6f2e710386f887c8edf36b6e89d71"

jobs:
  check:
    name: dweb-verify vectors (regenerate and compare)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vectors/dweb-verify
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: vectors/dweb-verify -> target
      - name: Install Kubo
        run: |
          curl -fsSL -o "$RUNNER_TEMP/kubo.tgz" "https://github.com/ipfs/kubo/releases/download/v${KUBO_VERSION}/kubo_v${KUBO_VERSION}_linux-amd64.tar.gz"
          echo "${KUBO_SHA512}  $RUNNER_TEMP/kubo.tgz" | sha512sum -c -
          tar -xzf "$RUNNER_TEMP/kubo.tgz" -C "$RUNNER_TEMP"
          echo "KUBO_BIN=$RUNNER_TEMP/kubo/ipfs" >> "$GITHUB_ENV"
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --release --all-targets -- -D warnings
      # The generator's own tests: an inherited proxy setting is ignored, and
      # every recorded CAR rebuilds from the committed vectors alone.
      - run: cargo test --locked --release
      - name: Regenerate and compare
        run: cargo run --locked --release -- check

  deny:
    name: dweb-verify vectors cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - name: Install cargo-deny
        run: |
          tarball="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSL -o "$tarball" "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/${tarball}"
          echo "${CARGO_DENY_SHA256}  ${tarball}" | sha256sum --check
          tar -xzf "$tarball" --strip-components=1 -C "$HOME/.cargo/bin" "cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl/cargo-deny"
      - working-directory: vectors/dweb-verify
        run: cargo deny --locked check
