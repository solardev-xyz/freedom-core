name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Daily, so new advisories against unchanged dependencies still surface.
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_DENY_VERSION: "0.20.2"
  CARGO_DENY_SHA256: "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f"

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      # freedom-cored as the release builds it: without its test hooks.
      - run: cargo clippy --locked -p freedom-cored --all-targets -- -D warnings
      # The test hooks never build into a release binary
      # (crates/freedom-cored/src/testhooks.rs): build.rs refuses them by
      # Cargo's profile, debug assertions or not.
      - name: A release build with the test hooks doesn't compile
        run: |
          for config in "" "--config profile.release.debug-assertions=true"; do
            if cargo check --locked --release -p freedom-cored --features testhooks $config 2> testhooks-release.err; then
              echo "a release build compiled with the testhooks feature ($config)" >&2
              exit 1
            fi
            grep -F "the \`testhooks\` feature is for debug and test builds only" testhooks-release.err
          done

  clippy-macos:
    # Confinement's macOS code (design 0010): fc-sys's Seatbelt and libproc
    # calls and fc-service's profile, which Linux's Clippy doesn't compile.
    name: clippy (macOS confinement)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --locked -p fc-sys -p fc-service --all-targets --all-features -- -D warnings
      # The key-store helper's Keychain backend (design 0013), as the
      # release builds it and with its tests' hooks.
      - run: cargo clippy --locked -p freedom-cored --bin freedom-cored -- -D warnings
      - run: cargo clippy --locked -p freedom-cored --bin freedom-cored --test keystore --all-features -- -D warnings

  keychain-macos:
    # The key store's macOS backend (design 0013, PRF-1): the helper and the
    # core against a temporary keychain this job creates, makes the user's
    # only keychain and default for the job, and deletes. The login keychain
    # is never used: the tests check that the default keychain is this one
    # before they touch any, and skip everywhere else.
    name: keystore (macOS temporary keychain)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --locked -p freedom-cored --all-features --test keystore --no-run
      - name: A temporary keychain, the default for this job
        run: |
          keychain="$RUNNER_TEMP/freedom-keystore-test.keychain"
          password="$(openssl rand -hex 16)"
          security default-keychain -d user > "$RUNNER_TEMP/default-keychain-before"
          security list-keychains -d user > "$RUNNER_TEMP/keychains-before"
          security create-keychain -p "$password" "$keychain"
          # No lock after a timeout or on sleep.
          security set-keychain-settings "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -d user -s "$keychain"
          security default-keychain -d user
          echo "FREEDOM_TEST_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
      - run: cargo test --locked -p freedom-cored --all-features --test keystore -- --test-threads=1
      - name: Delete the temporary keychain
        if: always()
        run: |
          if [ -s "$RUNNER_TEMP/default-keychain-before" ]; then
            security default-keychain -d user -s "$(tr -d '" ' < "$RUNNER_TEMP/default-keychain-before")"
          fi
          if [ -s "$RUNNER_TEMP/keychains-before" ]; then
            # shellcheck disable=SC2046
            security list-keychains -d user -s $(tr -d '"' < "$RUNNER_TEMP/keychains-before")
          fi
          if [ -n "${FREEDOM_TEST_KEYCHAIN:-}" ]; then
            security delete-keychain "$FREEDOM_TEST_KEYCHAIN"
          fi

  clippy-windows:
    # Confinement's Windows code (design 0010): fc-sys's job object and
    # mitigation calls and fc-service's use of them, which Linux's Clippy
    # doesn't compile.
    name: clippy (Windows confinement)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --locked -p fc-sys -p fc-service --all-targets --all-features -- -D warnings

  release-targets-linux:
    # The Release workflow builds freedom-cored for musl, where the `libc`
    # crate's tables differ from glibc's (0.9.0's tag failed on
    # aarch64-unknown-linux-musl: no `libc::SYS_kexec_file_load`). Check both
    # musl targets here, so a tag never finds that first.
    name: check (Linux musl release targets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: rustup target add aarch64-unknown-linux-musl x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo check --locked -p freedom-cored --target aarch64-unknown-linux-musl
      - run: cargo check --locked -p freedom-cored --target x86_64-unknown-linux-musl

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --locked --workspace --all-features
        if: runner.os == 'Windows'
      # On Linux and macOS with stdio alone, as main spawns a service: the
      # runner leaks a pipe into each step, which confinement's tests would
      # inherit and refuse (design 0010).
      - run: python3 scripts/stdio-only.py cargo test --locked --workspace --all-features
        if: runner.os != 'Windows'

  profile-gate:
    # Design 0013's latency gate (PRF-3): `profile open` under 100 ms at the
    # 95th percentile on each OS's runner (a first run with the cold start,
    # reported; on a miss, one warm re-measurement judged alone), measured on
    # the optimized binary main ships: each OS's release target and flags,
    # as the Release workflow builds them. The test job's debug run checks
    # only a loose bound (crates/freedom-cored/tests/profile_gate.rs). The
    # Windows runner has real-time scanning off, so an unsigned build's first
    # scan isn't measured here: 0013 qualifies it apart, before PRF-4.
    name: profile gate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    env:
      # As the Release workflow links Windows: the C runtime statically.
      RUSTFLAGS: ${{ contains(matrix.target, 'windows') && '-C target-feature=+crt-static' || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Toolchain
        shell: bash
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # This test alone, so nothing else runs beside the spawns it times. On
      # Linux and macOS with stdio alone, as main spawns the core: the runner
      # leaks a pipe into each step, which the subcommands' confinement
      # (design 0013, 0010) refuses once it lands.
      - name: profile open, optimized
        shell: bash
        run: |
          gate="cargo test --locked --release -p freedom-cored --target ${{ matrix.target }} --test profile_gate -- --nocapture"
          if [ "$RUNNER_OS" = Windows ]; then $gate; else python3 scripts/stdio-only.py $gate; fi

  confine-aarch64:
    # Confinement's seccomp filters name syscalls by number, which differ on
    # AArch64 (design 0010, "Linux"): its tests run there too.
    name: confine (ubuntu-24.04-arm)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: python3 scripts/stdio-only.py cargo test --locked -p fc-sys -p fc-service --all-features

  mobile-targets:
    # Logic crates must stay portable so freedom-mobile-ffi can link them
    # later. Checking from Linux also catches accidental Apple-SDK or NDK
    # build-script dependencies.
    name: compile check (iOS, Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: |
          rustup toolchain install
          rustup target add aarch64-apple-ios aarch64-linux-android
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo check --locked --workspace --lib --target aarch64-apple-ios
      - run: cargo check --locked --workspace --lib --target aarch64-linux-android

  vectors:
    name: vectors (pinned JS reference)
    # Both sides of the parity contract: Rust tests replay vectors/, and this
    # job re-derives every vector from the pinned freedom-browser JS, so a
    # drift on either side fails CI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: solardev-xyz/freedom-browser
          ref: fb540328162839e68150fe2c5e517edb86734d1c
          path: reference
          persist-credentials: false
      # The Radicle vectors' own reference (generate.js,
      # RADICLE_REFERENCE_COMMIT): integration/rust-core's main, which
      # freedom-browser's parity harness replays them against.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: solardev-xyz/freedom-browser
          ref: 1ea598373fcc406bed8a3df1e54b734dcc4e5ac5
          path: radicle-reference
          persist-credentials: false
      # The approvals vectors' own reference (generate.js,
      # APPROVALS_REFERENCE_COMMIT): integration/rust-core with SEC-1's
      # eleventh token kind and 0011's page tokens. Its generator reads no
      # package, so nothing is installed there.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: solardev-xyz/freedom-browser
          ref: 7f85551d82bddb1337df73b331785e969d62d1b9
          path: approvals-reference
          persist-credentials: false
      # The vectors' meta records the Node version; it is part of the check.
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24.15.0
      - name: Install the reference's dependencies
        working-directory: reference
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install the Radicle reference's dependencies
        working-directory: radicle-reference
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check every vector against the reference
        env:
          FREEDOM_BROWSER_CHECKOUT: ${{ github.workspace }}/reference
          FREEDOM_BROWSER_RADICLE_CHECKOUT: ${{ github.workspace }}/radicle-reference
          FREEDOM_BROWSER_APPROVALS_CHECKOUT: ${{ github.workspace }}/approvals-reference
        run: |
          node vectors/generator/generate.js check --freedom-browser "$FREEDOM_BROWSER_CHECKOUT" \
            --radicle-browser "$FREEDOM_BROWSER_RADICLE_CHECKOUT" \
            --approvals-browser "$FREEDOM_BROWSER_APPROVALS_CHECKOUT"
          node --test vectors/generator/check.test.js
      # Design 0013's interop harness: the profiles reference's catalog code
      # and freedom-cored's subcommands on one app root, the catalog's write
      # lock held both ways (vectors/generator/interop.test.js). It needs a
      # build with the test hooks.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --locked -p freedom-cored --features testhooks
      - name: The profile catalog's interop harness
        env:
          FREEDOM_BROWSER_CHECKOUT: ${{ github.workspace }}/reference
          FREEDOM_BROWSER_APPROVALS_CHECKOUT: ${{ github.workspace }}/approvals-reference
          FREEDOM_CORED: ${{ github.workspace }}/target/debug/freedom-cored
        run: node --test vectors/generator/interop.test.js

  fuzz:
    # cargo-fuzz targets for the parsers that take untrusted bytes (design
    # 0001, Testing): fc-json, fc-protocol's frames, fragments, stream
    # frames, messages and secret fields, the vault file, fc-keys' OpenSSH
    # readers, fc-seal's open and seal, fc-chain's reading of an RPC answer
    # and fc-naming's of a resolver's or gateway's. Each target
    # runs for a fixed time: a minute on pushes and PRs, five on the daily
    # run. A crash fails the job and uploads the input that caused it.
    name: fuzz (nightly, time-boxed)
    runs-on: ubuntu-latest
    # Sized for the daily run with a cold cache: 8 targets x 300 s = 40 min
    # of fuzzing (each ends a second or two after its time), plus about
    # 10 min before it (the toolchain, building cargo-fuzz, then the lints
    # and every target from clean, about 4 min of that) and the cache save
    # after, about 50 min in all. 75 leaves 25 for a slow runner. A PR run
    # fuzzes 8 x 60 s = 8 min. Each new target adds 5 min to the daily run:
    # raise this with it.
    timeout-minutes: 75
    env:
      # cargo-fuzz needs nightly (sanitizers, coverage instrumentation).
      # Pinned, so a nightly regression can't fail unrelated PRs.
      RUSTUP_TOOLCHAIN: nightly-2026-10-01
      CARGO_FUZZ_VERSION: "0.13.2"
      FUZZ_SECONDS: ${{ github.event_name == 'schedule' && '300' || '60' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt,clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz -> target
      - name: Install cargo-fuzz
        run: cargo install --locked cargo-fuzz --version "$CARGO_FUZZ_VERSION"
      - name: Lockfile, format and lints
        working-directory: fuzz
        run: |
          cargo fetch --locked
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
      - name: Build every target
        # Debug assertions on: an arithmetic overflow is a finding too.
        run: cargo fuzz build --debug-assertions
      - name: Fuzz each target
        run: |
          for target in $(cargo fuzz list); do
            echo "::group::$target ($FUZZ_SECONDS s)"
            # New inputs go to the first directory, which libFuzzer
            # requires to exist; the committed seeds are only read.
            mkdir -p "fuzz/corpus/$target"
            cargo fuzz run --debug-assertions "$target" "fuzz/corpus/$target" "fuzz/seeds/$target" -- \
              -max_total_time="$FUZZ_SECONDS" -timeout=10 -rss_limit_mb=2048
            echo "::endgroup::"
          done
      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 14

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - name: Install cargo-deny
        run: |
          tarball="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSL -o "$tarball" "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/${tarball}"
          echo "${CARGO_DENY_SHA256}  ${tarball}" | sha256sum --check
          tar -xzf "$tarball" --strip-components=1 -C "$HOME/.cargo/bin" "cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl/cargo-deny"
      - run: cargo deny --locked check
      - name: THIRD-PARTY-NOTICES is current
        # The release archives ship it next to the binary (statically linked
        # crates' licenses require their notices).
        run: |
          cargo fetch --locked
          python3 scripts/third-party-notices.py --check
          python3 -m unittest discover -s scripts -p 'test_*.py'
