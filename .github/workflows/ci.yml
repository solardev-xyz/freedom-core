name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Daily, so new advisories against unchanged dependencies still surface.
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_DENY_VERSION: "0.20.2"
  CARGO_DENY_SHA256: "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f"

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --locked --workspace --all-features
        if: runner.os != 'Linux'
      # With stdio alone, as main spawns a service: the runner leaks a pipe
      # into each step, which confinement's tests would inherit and refuse
      # (design 0010).
      - run: python3 scripts/stdio-only.py cargo test --locked --workspace --all-features
        if: runner.os == 'Linux'

  confine-aarch64:
    # Confinement's seccomp filters name syscalls by number, which differ on
    # AArch64 (design 0010, "Linux"): its tests run there too.
    name: confine (ubuntu-24.04-arm)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: python3 scripts/stdio-only.py cargo test --locked -p fc-sys -p fc-service --all-features

  mobile-targets:
    # Logic crates must stay portable so freedom-mobile-ffi can link them
    # later. Checking from Linux also catches accidental Apple-SDK or NDK
    # build-script dependencies.
    name: compile check (iOS, Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: |
          rustup toolchain install
          rustup target add aarch64-apple-ios aarch64-linux-android
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo check --locked --workspace --lib --target aarch64-apple-ios
      - run: cargo check --locked --workspace --lib --target aarch64-linux-android

  vectors:
    name: vectors (pinned JS reference)
    # Both sides of the parity contract: Rust tests replay vectors/, and this
    # job re-derives every vector from the pinned freedom-browser JS, so a
    # drift on either side fails CI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: solardev-xyz/freedom-browser
          ref: fb540328162839e68150fe2c5e517edb86734d1c
          path: reference
          persist-credentials: false
      # The vectors' meta records the Node version; it is part of the check.
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24.15.0
      - name: Install the reference's dependencies
        working-directory: reference
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check every vector against the reference
        env:
          FREEDOM_BROWSER_CHECKOUT: ${{ github.workspace }}/reference
        run: |
          node vectors/generator/generate.js check --freedom-browser "$FREEDOM_BROWSER_CHECKOUT"
          node --test vectors/generator/check.test.js

  fuzz:
    # cargo-fuzz targets for the parsers that take untrusted bytes (design
    # 0001, Testing): fc-json, fc-protocol's frames, fragments, stream
    # frames, messages and secret fields, and the vault file. Each target
    # runs for a fixed time: a minute on pushes and PRs, five on the daily
    # run. A crash fails the job and uploads the input that caused it.
    name: fuzz (nightly, time-boxed)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # cargo-fuzz needs nightly (sanitizers, coverage instrumentation).
      # Pinned, so a nightly regression can't fail unrelated PRs.
      RUSTUP_TOOLCHAIN: nightly-2026-10-01
      CARGO_FUZZ_VERSION: "0.13.2"
      FUZZ_SECONDS: ${{ github.event_name == 'schedule' && '300' || '60' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt,clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz -> target
      - name: Install cargo-fuzz
        run: cargo install --locked cargo-fuzz --version "$CARGO_FUZZ_VERSION"
      - name: Lockfile, format and lints
        working-directory: fuzz
        run: |
          cargo fetch --locked
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
      - name: Build every target
        # Debug assertions on: an arithmetic overflow is a finding too.
        run: cargo fuzz build --debug-assertions
      - name: Fuzz each target
        run: |
          for target in $(cargo fuzz list); do
            echo "::group::$target ($FUZZ_SECONDS s)"
            # New inputs go to the first directory, which libFuzzer
            # requires to exist; the committed seeds are only read.
            mkdir -p "fuzz/corpus/$target"
            cargo fuzz run --debug-assertions "$target" "fuzz/corpus/$target" "fuzz/seeds/$target" -- \
              -max_total_time="$FUZZ_SECONDS" -timeout=10 -rss_limit_mb=2048
            echo "::endgroup::"
          done
      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 14

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - name: Install cargo-deny
        run: |
          tarball="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSL -o "$tarball" "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/${tarball}"
          echo "${CARGO_DENY_SHA256}  ${tarball}" | sha256sum --check
          tar -xzf "$tarball" --strip-components=1 -C "$HOME/.cargo/bin" "cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl/cargo-deny"
      - run: cargo deny --locked check
      - name: THIRD-PARTY-NOTICES is current
        # The release archives ship it next to the binary (statically linked
        # crates' licenses require their notices).
        run: |
          cargo fetch --locked
          python3 scripts/third-party-notices.py --check
          python3 -m unittest discover -s scripts -p 'test_*.py'
